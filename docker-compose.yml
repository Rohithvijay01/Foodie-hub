services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodie_db}
      POSTGRES_USER: ${POSTGRES_USER:-foodie_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodie_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-foodie_user} -d $${POSTGRES_DB:-foodie_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foodie_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foodie_net

  app:
    image: foodie-hub-app:local-build
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-foodie_user}:${POSTGRES_PASSWORD:-foodie_password}@db:5432/${POSTGRES_DB:-foodie_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-development_secret_key}
      ENVIRONMENT: docker
      LOG_LEVEL: INFO
    ports:
      - "${APP_PORT:-8000}:8000"
    networks:
      - foodie_net

volumes:
  postgres_data:
  redis_data:

networks:
  foodie_net:
    driver: bridge
